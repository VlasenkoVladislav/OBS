target: ingester
multitenancy_enabled: false
no_auth_tenant: "anonymous"

server:
  http_listen_port: 8080
  grpc_listen_port: 9095

memberlist:
  bind_addr: [0.0.0.0]
  bind_port: 9096
  join_members:
    - "mimir-main:9096"
    - "mimir-ingester-1:9096"
    - "mimir-ingester-2:9096"

ingester:
  ring:
    kvstore:
      store: memberlist
    replication_factor: 2
    instance_id: ${INSTANCE_ID}
    instance_addr: ${HOSTNAME}
    instance_port: 9095
    heartbeat_period: 15s
    heartbeat_timeout: 1m
    num_tokens: 128

blocks_storage:
  s3:
    bucket_name: mimir
  storage_prefix: blocks
  tsdb:
    dir: /data/mimir/tsdb
    block_ranges_period: [2h]
    retention_period: 720h

common:
  storage:
    backend: s3
    s3:
      endpoint: minio:9000
      bucket_name: mimir
      access_key_id: KAWN6W9RLRHOTUV8RNMB
      secret_access_key: tsurs59GbYFejS01+lUmoP6ZiCwaKugB1sWPAZbE
      insecure: true

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 0
  max_global_series_per_metric: 0
  out_of_order_time_window: 6h

usage_stats:
  enabled: false
