global:
  scrape_interval: 5s
  external_labels:
    site: prod

remote_write:
  - url: http://mimir:9009/api/v1/push
    name: mimir-prod
    queue_config:
      capacity: 10000
      max_shards: 5
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 5s
    write_relabel_configs: []   # no extra filtering; site:prod comes from external_labels

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']