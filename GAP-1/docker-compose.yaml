services:
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability-net

  node_exporter:
    image: prom/node-exporter
    ports:
      - "9100:9100"
    networks:
      - observability-net

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - observability-net

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter
    command:
      - -nginx.scrape-uri=http://nginx/stub_status
    ports:
      - "9113:9113"
    networks:
      - observability-net

  php:
    image: php:8.2-fpm
    networks:
      - observability-net

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    networks:
      - observability-net

  mysqld_exporter:
    image: prom/mysqld-exporter
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter_pass
    ports:
      - "9104:9104"
    networks:
      - observability-net
    depends_on:
      - db
      
  blackbox:
    image: prom/blackbox-exporter
    ports:
      - "9115:9115"
    networks:
      - observability-net

  alertmanager:
    image: prom/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - observability-net

networks:
  observability-net:
    external: true
    name: observability_observability-net
