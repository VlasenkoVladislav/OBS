services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
    volumes:
      - ./data/postgres-data:/var/lib/postgresql/data
    networks:
      - observability-net
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
    ports:
      - "10051:10051"
    depends_on:
      - postgres
    networks:
      - observability-net
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Amsterdam
    ports:
      - "8081:8080"
    depends_on:
      - zabbix-server
    networks:
      - observability-net
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent2:latest
    environment:
      ZBX_HOSTNAME: "otus-host"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: 10051
    volumes:
      - ./scripts:/etc/zabbix/scripts
      - ./zabbix_agent2.conf:/etc/zabbix/zabbix_agent2.d/otus.conf
    depends_on:
      - zabbix-server
    networks:
      - observability-net
    restart: unless-stopped

networks:
  observability-net:
    external: true
    name: observability_observability-net