[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name          tail
    Path          /var/log/nginx/access.log
    Tag           nginx.access
    DB            /tmp/fluentbit.db
    Refresh_Interval 5
    Parser        nginx

[OUTPUT]
    Name          http
    Match         nginx.*
    Host          data-prepper
    Port          2021
    URI           /log/ingest
    Format        json
    json_date_key @timestamp
    json_date_format iso8601