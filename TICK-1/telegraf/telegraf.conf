[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = ""
  omit_hostname = false

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  timeout = "5s"

# ---------------- SYSTEM METRICS ----------------

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

[[inputs.system]]

[[inputs.net]]

# ---------------- DOCKER METRICS ----------------

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = []
  container_name_exclude = []
  timeout = "5s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]

# ---------------- NGINX METRICS ----------------
# Требует nginx stub_status (включён в nginx/default.conf)

[[inputs.nginx]]
  urls = ["http://nginx:80/nginx_status"]
  response_timeout = "5s"

# ---------------- MYSQL METRICS ----------------

[[inputs.mysql]]
  servers = ["dvwa:dvwa@tcp(db:3306)/dvwa"]
  metric_version = 2
  gather_innodb_metrics = true
  gather_global_status = true
  gather_global_variables = true
  gather_slave_status = false
  gather_table_io_waits = false
  gather_table_lock_waits = false
  gather_index_io_waits = false
  gather_event_waits = false
  gather_file_events_stats = false
  gather_perf_events_statements = false
  interval_slow = "30m"

# ---------------- APPLICATION HEALTH ----------------

[[inputs.http_response]]
  urls = ["http://nginx:80"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = true
  response_string_match = ""
  [inputs.http_response.tags]
    service = "nginx-frontend"

[[inputs.http_response]]
  urls = ["http://nginx:80/login.php"]
  method = "GET"
  response_timeout = "5s"
  follow_redirects = true
  [inputs.http_response.tags]
    service = "dvwa-login"